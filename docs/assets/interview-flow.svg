<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">MirrorAgent interview flow</title>
  <desc id="desc">Eleven-step interview workflow from job description and resume to report and personalized study plan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1800" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/><stop offset="1" stop-color="#11162b"/>
    </linearGradient>
    <linearGradient id="prep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123f54"/><stop offset="1" stop-color="#102737"/></linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2d285c"/><stop offset="1" stop-color="#1b2447"/></linearGradient>
    <linearGradient id="review" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a3429"/><stop offset="1" stop-color="#2f2630"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8ac6e8" stroke-opacity=".05"/></pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#01040a" flood-opacity=".52"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#70e7ff"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#b29aff"/></marker>
  </defs>
  <rect width="1800" height="760" rx="28" fill="url(#bg)"/><rect width="1800" height="760" rx="28" fill="url(#grid)"/>
  <text x="72" y="74" fill="#f5fbff" font-family="Inter,Microsoft YaHei,sans-serif" font-size="34" font-weight="700">MirrorAgent 面试流程</text>
  <text x="74" y="108" fill="#8fa9bf" font-family="Inter,Microsoft YaHei,sans-serif" font-size="17">从岗位理解到复习闭环，让每一轮对话都沉淀为下一次进步</text>
  <g font-family="Inter,Microsoft YaHei,sans-serif">
    <rect x="72" y="142" width="526" height="34" rx="17" fill="#10384a"/><text x="335" y="165" text-anchor="middle" fill="#8aeaff" font-size="14" font-weight="700" letter-spacing="1.5">01 — 准备 / CONTEXT</text>
    <rect x="620" y="142" width="704" height="34" rx="17" fill="#282454"/><text x="972" y="165" text-anchor="middle" fill="#d2c5ff" font-size="14" font-weight="700" letter-spacing="1.5">02 — 面试 / ADAPTIVE LOOP</text>
    <rect x="1346" y="142" width="382" height="34" rx="17" fill="#4a3428"/><text x="1537" y="165" text-anchor="middle" fill="#ffe1a2" font-size="14" font-weight="700" letter-spacing="1.5">03 — 复盘 / GROWTH</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="4">
    <path d="M286 330H338" stroke="#70e7ff" marker-end="url(#arrow)"/><path d="M552 330H604" stroke="#70e7ff" marker-end="url(#arrow)"/>
    <path d="M818 330H870" stroke="#b29aff" marker-end="url(#arrow-violet)"/><path d="M1084 330H1136" stroke="#b29aff" marker-end="url(#arrow-violet)"/><path d="M1350 330H1402" stroke="#b29aff" marker-end="url(#arrow-violet)"/>
    <path d="M1616 330V500H1510" stroke="#f6c96c" marker-end="url(#arrow)"/><path d="M1296 600H1244" stroke="#f6c96c" marker-end="url(#arrow)"/><path d="M1080 600H1028" stroke="#f6c96c" marker-end="url(#arrow)"/><path d="M864 600H812" stroke="#f6c96c" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Inter,Microsoft YaHei,sans-serif" filter="url(#shadow)">
    <g transform="translate(72 218)"><rect width="214" height="224" rx="20" fill="url(#prep)" stroke="#347f98" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#1e829e"/><text x="38" y="49" text-anchor="middle" fill="#f3feff" font-size="18" font-weight="700">01</text><text x="76" y="49" fill="#f5fbff" font-size="19" font-weight="700">输入上下文</text><text x="28" y="98" fill="#a6e9f5" font-size="15">JD + 简历</text><text x="28" y="132" fill="#b8cbd4" font-size="14">岗位目标</text><text x="28" y="157" fill="#b8cbd4" font-size="14">项目经历</text><path d="M28 185h158" stroke="#4c93a8" stroke-opacity=".55"/><text x="28" y="210" fill="#7fd9e8" font-size="13">建立面试上下文</text></g>
    <g transform="translate(338 218)"><rect width="214" height="224" rx="20" fill="url(#prep)" stroke="#347f98" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#1e829e"/><text x="38" y="49" text-anchor="middle" fill="#f3feff" font-size="18" font-weight="700">02</text><text x="76" y="49" fill="#f5fbff" font-size="19" font-weight="700">岗位分析</text><text x="28" y="98" fill="#a6e9f5" font-size="15">JD Analyzer</text><text x="28" y="132" fill="#b8cbd4" font-size="14">拆解技术栈</text><text x="28" y="157" fill="#b8cbd4" font-size="14">识别关键能力</text><path d="M28 185h158" stroke="#4c93a8" stroke-opacity=".55"/><text x="28" y="210" fill="#7fd9e8" font-size="13">生成岗位画像</text></g>
    <g transform="translate(604 218)"><rect width="214" height="224" rx="20" fill="url(#prep)" stroke="#347f98" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#1e829e"/><text x="38" y="49" text-anchor="middle" fill="#f3feff" font-size="18" font-weight="700">03</text><text x="76" y="49" fill="#f5fbff" font-size="19" font-weight="700">简历匹配</text><text x="28" y="98" fill="#a6e9f5" font-size="15">Resume Matcher</text><text x="28" y="132" fill="#b8cbd4" font-size="14">映射项目证据</text><text x="28" y="157" fill="#b8cbd4" font-size="14">标注能力差距</text><path d="M28 185h158" stroke="#4c93a8" stroke-opacity=".55"/><text x="28" y="210" fill="#7fd9e8" font-size="13">加载历史薄弱点</text></g>
    <g transform="translate(870 218)"><rect width="214" height="224" rx="20" fill="url(#live)" stroke="#6e62ae" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#705cc9"/><text x="38" y="49" text-anchor="middle" fill="#f8f5ff" font-size="18" font-weight="700">04</text><text x="76" y="49" fill="#f5fbff" font-size="19" font-weight="700">规划方向</text><text x="28" y="98" fill="#d5caff" font-size="15">Question Planner</text><text x="28" y="132" fill="#c4c4d8" font-size="14">基础知识</text><text x="28" y="157" fill="#c4c4d8" font-size="14">项目经历 · 系统设计</text><path d="M28 185h158" stroke="#796fbb" stroke-opacity=".6"/><text x="28" y="210" fill="#c5b9ff" font-size="13">确定节奏与难度</text></g>
    <g transform="translate(1136 218)"><rect width="214" height="224" rx="20" fill="url(#live)" stroke="#6e62ae" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#705cc9"/><text x="38" y="49" text-anchor="middle" fill="#f8f5ff" font-size="18" font-weight="700">05</text><text x="76" y="49" fill="#f5fbff" font-size="19" font-weight="700">检索题目</text><text x="28" y="98" fill="#d5caff" font-size="15">Hybrid RAG</text><text x="28" y="132" fill="#c4c4d8" font-size="14">Milvus + BM25</text><text x="28" y="157" fill="#c4c4d8" font-size="14">Reranker / LLM 补题</text><path d="M28 185h158" stroke="#796fbb" stroke-opacity=".6"/><text x="28" y="210" fill="#c5b9ff" font-size="13">取最相关的下一题</text></g>
    <g transform="translate(1402 218)"><rect width="214" height="224" rx="20" fill="url(#live)" stroke="#6e62ae" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#705cc9"/><text x="38" y="49" text-anchor="middle" fill="#f8f5ff" font-size="18" font-weight="700">06</text><text x="76" y="49" fill="#f5fbff" font-size="19" font-weight="700">逐题面试</text><text x="28" y="98" fill="#d5caff" font-size="15">Interviewer</text><text x="28" y="132" fill="#c4c4d8" font-size="14">回答 · 追问</text><text x="28" y="157" fill="#c4c4d8" font-size="14">捕捉表达信号</text><path d="M28 185h158" stroke="#796fbb" stroke-opacity=".6"/><text x="28" y="210" fill="#c5b9ff" font-size="13">实时推进对话</text></g>
    <g transform="translate(1296 488)"><rect width="214" height="224" rx="20" fill="url(#review)" stroke="#a47b44" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#aa7d40"/><text x="38" y="49" text-anchor="middle" fill="#fff7e8" font-size="18" font-weight="700">07</text><text x="76" y="49" fill="#fff8e9" font-size="19" font-weight="700">动态评分</text><text x="28" y="98" fill="#ffe2a5" font-size="15">Evaluator</text><text x="28" y="132" fill="#dfcda9" font-size="14">准确性 · 深度</text><text x="28" y="157" fill="#dfcda9" font-size="14">按表现调难度</text><path d="M28 185h158" stroke="#a47b44" stroke-opacity=".65"/><text x="28" y="210" fill="#f4d58f" font-size="13">决定下一轮追问</text></g>
    <g transform="translate(1080 488)"><rect width="214" height="224" rx="20" fill="url(#review)" stroke="#a47b44" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#aa7d40"/><text x="38" y="49" text-anchor="middle" fill="#fff7e8" font-size="18" font-weight="700">08</text><text x="76" y="49" fill="#fff8e9" font-size="19" font-weight="700">低分巩固</text><text x="28" y="98" fill="#ffe2a5" font-size="15">Weakness Loop</text><text x="28" y="132" fill="#dfcda9" font-size="14">回收薄弱题</text><text x="28" y="157" fill="#dfcda9" font-size="14">补充相邻知识</text><path d="M28 185h158" stroke="#a47b44" stroke-opacity=".65"/><text x="28" y="210" fill="#f4d58f" font-size="13">形成可执行练习</text></g>
    <g transform="translate(864 488)"><rect width="214" height="224" rx="20" fill="url(#review)" stroke="#a47b44" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#aa7d40"/><text x="38" y="49" text-anchor="middle" fill="#fff7e8" font-size="18" font-weight="700">09</text><text x="76" y="49" fill="#fff8e9" font-size="19" font-weight="700">评估报告</text><text x="28" y="98" fill="#ffe2a5" font-size="15">Interview Report</text><text x="28" y="132" fill="#dfcda9" font-size="14">优势与风险</text><text x="28" y="157" fill="#dfcda9" font-size="14">证据化反馈</text><path d="M28 185h158" stroke="#a47b44" stroke-opacity=".65"/><text x="28" y="210" fill="#f4d58f" font-size="13">沉淀长期画像</text></g>
    <g transform="translate(648 488)"><rect width="214" height="224" rx="20" fill="url(#review)" stroke="#a47b44" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#aa7d40"/><text x="38" y="49" text-anchor="middle" fill="#fff7e8" font-size="18" font-weight="700">10</text><text x="76" y="49" fill="#fff8e9" font-size="19" font-weight="700">复习计划</text><text x="28" y="98" fill="#ffe2a5" font-size="15">Review Planner</text><text x="28" y="132" fill="#dfcda9" font-size="14">按优先级排期</text><text x="28" y="157" fill="#dfcda9" font-size="14">推荐 GitHub 项目</text><path d="M28 185h158" stroke="#a47b44" stroke-opacity=".65"/><text x="28" y="210" fill="#f4d58f" font-size="13">开始下一轮训练</text></g>
    <g transform="translate(432 488)"><rect width="214" height="224" rx="20" fill="url(#review)" stroke="#a47b44" stroke-width="2"/><circle cx="38" cy="42" r="23" fill="#aa7d40"/><text x="38" y="49" text-anchor="middle" fill="#fff7e8" font-size="18" font-weight="700">11</text><text x="76" y="49" fill="#fff8e9" font-size="19" font-weight="700">能力画像</text><text x="28" y="98" fill="#ffe2a5" font-size="15">Long-term Memory</text><text x="28" y="132" fill="#dfcda9" font-size="14">更新薄弱点权重</text><text x="28" y="157" fill="#dfcda9" font-size="14">影响下一次出题</text><path d="M28 185h158" stroke="#a47b44" stroke-opacity=".65"/><text x="28" y="210" fill="#f4d58f" font-size="13">闭环完成</text></g>
  </g>
  <text x="1728" y="728" text-anchor="end" fill="#6f899c" font-family="Inter,Microsoft YaHei,sans-serif" font-size="13">MIRRORAGENT / INTERVIEW LOOP</text>
</svg>
