name: backend-ci

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MirrorAgent-java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests (incl. offline BM25 retrieval regression)
        run: mvn -ntp -B test