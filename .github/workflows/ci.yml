name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: MirrorAgent-java
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: MirrorAgent-web
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 20.19
        uses: actions/setup-node@v5
        with:
          node-version-file: MirrorAgent-web/.nvmrc
          cache: npm
          cache-dependency-path: MirrorAgent-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate infrastructure Compose
        run: docker compose -f MirrorAgent-java/docker-compose.yml config --quiet

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: MirrorAgent-java
          push: false
          tags: mirror-agent-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max